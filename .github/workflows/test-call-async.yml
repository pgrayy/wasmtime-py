name: Test call_async

on:
  push:
    branches: [ci/test-windows]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone wasmtime fork
        run: git clone --branch upstream/poll-with-notify --depth 1 https://github.com/pgrayy/wasmtime.git wasmtime-src

      - name: Build wasmtime C API
        working-directory: wasmtime-src
        run: cargo build --release -p wasmtime-c-api

      - name: Link library (Unix)
        if: runner.os == 'Linux'
        run: |
          mkdir -p wasmtime/linux-x86_64
          ln -sf ${{ github.workspace }}/wasmtime-src/target/release/libwasmtime.so wasmtime/linux-x86_64/_libwasmtime.so

      - name: Link library (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p wasmtime/darwin-aarch64
          ln -sf ${{ github.workspace }}/wasmtime-src/target/release/libwasmtime.dylib wasmtime/darwin-aarch64/_libwasmtime.dylib

      - name: Link library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path wasmtime\win32-x86_64
          Copy-Item wasmtime-src\target\release\wasmtime.dll wasmtime\win32-x86_64\_wasmtime.dll

      - name: Run tests
        run: python -m unittest tests.component.test_func tests.component.test_linker tests.test_config -v
        timeout-minutes: 2
